name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: SoftHSM2 for the PKCS#11 tests
        run: sudo apt-get update && sudo apt-get install -y softhsm2
      - run: pip install -e ".[dev,hsm]" ruff
      - run: ruff check .
      - run: pytest
      - name: Validate Prometheus rules and Alertmanager config
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/p" --entrypoint promtool prom/prometheus:v3.5.0 check rules /p/rules/certadillo.rules.yml
          docker run --rm -v "$PWD/deploy/alertmanager:/a" --entrypoint amtool prom/alertmanager:v0.28.1 check-config /a/alertmanager.yml

  interop:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . certbot
      - name: certbot http-01 -> issue, verify, OCSP, revoke, CRL
        run: sudo -E env "PATH=$PATH" bash scripts/interop-certbot.sh
      - name: micromdm scepclient -> SCEP issue, challenge reuse and scope checks
        run: PORT=8081 bash scripts/interop-scep.sh

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: certadillo:ci
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: certadillo:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: certadillo:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
