name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: SoftHSM2, sshd, nginx and age for the PKCS#11, push provisioning and backup tests
        run: sudo apt-get update && sudo apt-get install -y softhsm2 openssh-server nginx age
      - name: HashiCorp Vault for the Transit signer tests (checksum-verified)
        env:
          VAULT_VERSION: "2.1.1"
        run: |
          cd /tmp
          curl -fsSLO "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip"
          curl -fsSLO "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_SHA256SUMS"
          grep "linux_amd64.zip" "vault_${VAULT_VERSION}_SHA256SUMS" | sha256sum -c -
          unzip -q "vault_${VAULT_VERSION}_linux_amd64.zip" vault && sudo mv vault /usr/local/bin/ && vault version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Pebble, the ACME test CA, for the upstream issuer tests
        run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.9.0
          go install github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@v2.9.0
      - run: pip install -e ".[dev,hsm]" ruff
      - run: ruff check .
      - run: pytest
      - name: Validate Prometheus rules and Alertmanager config
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/p" --entrypoint promtool prom/prometheus:v3.5.0 check rules /p/rules/certadillo.rules.yml
          docker run --rm -v "$PWD/deploy/alertmanager:/a" --entrypoint amtool prom/alertmanager:v0.28.1 check-config /a/alertmanager.yml

  interop:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e . certbot
      - name: certbot http-01 -> issue, verify, OCSP, revoke, CRL
        run: sudo -E env "PATH=$PATH" bash scripts/interop-certbot.sh
      - name: micromdm scepclient -> SCEP issue, challenge reuse, scope checks, PENDING and polling
        run: PORT=8081 bash scripts/interop-scep.sh
      - name: certbot dns-01 wildcard, ARI-driven renewal, unregister
        run: PORT=8082 bash scripts/interop-acme-dns.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: GlobalSign estclient through nginx -> enroll, re-enroll by certificate, serverkeygen, IDevID
        run: |
          sudo apt-get install -y nginx
          go install github.com/globalsign/est/cmd/estclient@v1.0.7
          sudo -E env "PATH=$PATH:$(go env GOPATH)/bin" PORT=8083 bash scripts/interop-est.sh

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Known vulnerabilities in the locked dependencies (pip-audit, OSV and PyPI advisories)
        run: |
          pip install pip-audit
          pip-audit --require-hashes --disable-pip -r requirements/image.txt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: certadillo:ci
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: certadillo:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: certadillo:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
