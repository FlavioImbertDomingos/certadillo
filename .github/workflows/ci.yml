name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: SoftHSM2 for the PKCS#11 tests
        run: sudo apt-get update && sudo apt-get install -y softhsm2
      - name: HashiCorp Vault for the Transit signer tests (checksum-verified)
        env:
          VAULT_VERSION: "2.1.1"
        run: |
          cd /tmp
          curl -fsSLO "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip"
          curl -fsSLO "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_SHA256SUMS"
          grep "linux_amd64.zip" "vault_${VAULT_VERSION}_SHA256SUMS" | sha256sum -c -
          unzip -q "vault_${VAULT_VERSION}_linux_amd64.zip" vault && sudo mv vault /usr/local/bin/ && vault version
      - run: pip install -e ".[dev,hsm]" ruff
      - run: ruff check .
      - run: pytest
      - name: Validate Prometheus rules and Alertmanager config
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/p" --entrypoint promtool prom/prometheus:v3.5.0 check rules /p/rules/certadillo.rules.yml
          docker run --rm -v "$PWD/deploy/alertmanager:/a" --entrypoint amtool prom/alertmanager:v0.28.1 check-config /a/alertmanager.yml

  interop:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install -e . certbot
      - name: certbot http-01 -> issue, verify, OCSP, revoke, CRL
        run: sudo -E env "PATH=$PATH" bash scripts/interop-certbot.sh
      - name: micromdm scepclient -> SCEP issue, challenge reuse, scope checks, PENDING and polling
        run: PORT=8081 bash scripts/interop-scep.sh
      - name: certbot dns-01 wildcard, ARI-driven renewal, unregister
        run: PORT=8082 bash scripts/interop-acme-dns.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: GlobalSign estclient through nginx -> enroll, re-enroll by certificate, serverkeygen, IDevID
        run: |
          sudo apt-get install -y nginx
          go install github.com/globalsign/est/cmd/estclient@v1.0.7
          sudo -E env "PATH=$PATH:$(go env GOPATH)/bin" PORT=8083 bash scripts/interop-est.sh

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: certadillo:ci
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: certadillo:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: certadillo:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sbom
          path: sbom.cdx.json
