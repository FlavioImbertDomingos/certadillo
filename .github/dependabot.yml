# Actions are pinned to commit SHAs; Dependabot keeps the pins and the version comments current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
  # the hash-pinned lock the image installs from (pip-compile --generate-hashes)
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    groups:
      image-dependencies:
        patterns: ["*"]
