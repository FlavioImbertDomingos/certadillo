    <circle cx="101" cy="112" r="3"/><circle cx="151" cy="60" r="3"/><circle cx="152" cy="112" r="3"/>
    <circle cx="172" cy="80" r="3"/><circle cx="173" cy="106" r="3"/>
  </g>
  <!-- keyhole badge -->
