    <path d="M96 44 C88 70 86 100 90 128"/>
    <path d="M118 39 C112 70 112 100 115 128"/>
    <path d="M140 40 C138 70 138 100 140 128"/>
    <path d="M161 50 C163 76 164 102 163 128"/>
