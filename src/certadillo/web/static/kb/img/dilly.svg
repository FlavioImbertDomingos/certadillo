<svg width="660" height="510" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 170" role="img" aria-labelledby="t">
  <title id="t">Dilly, the Certadillo armadillo</title>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
