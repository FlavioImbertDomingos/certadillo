# nginx site for certadillo.com, in front of the container on 127.0.0.1:8080.
#
# 1. DNS: A records for certadillo.com and www.certadillo.com -> 154.53.47.199
# 2. Copy this file to /etc/nginx/sites-available/certadillo.com (or conf.d/certadillo.com.conf),
#    link it into sites-enabled, then: nginx -t && systemctl reload nginx
# 3. TLS: certbot --nginx -d certadillo.com -d www.certadillo.com
#    (certbot adds the 443 server block and the HTTP -> HTTPS redirect to this file)
# 4. Redeploy so certificates and ACME links carry the new URL and 8080 closes to the internet:
#    BASE_URL=https://certadillo.com BIND=127.0.0.1 deploy/server/deploy.sh root@154.53.47.199

server {
    listen 80;
    listen [::]:80;
    server_name certadillo.com www.certadillo.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
