apiVersion: v1
kind: Service
metadata:
  name: {{ include "certadillo.fullname" . }}
  labels: {{- include "certadillo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "certadillo.selector" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "certadillo.fullname" . }}
  labels: {{- include "certadillo.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # CA and OCSP keys live here; never delete with the release
spec:
  accessModes: [{{ .Values.persistence.accessMode }}]
  resources: {requests: {storage: {{ .Values.persistence.size }}}}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
{{- if .Values.policies }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "certadillo.fullname" . }}-policies
  labels: {{- include "certadillo.labels" . | nindent 4 }}
data:
  policies.yaml: {{ .Values.policies | quote }}
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "certadillo.fullname" . }}
  labels: {{- include "certadillo.labels" . | nindent 4 }}
spec:
  {{- if gt (int .Values.replicaCount) 1 }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else }}
  maxUnavailable: 1   # a single replica can still be drained
  {{- end }}
  selector:
    matchLabels: {{- include "certadillo.selector" . | nindent 6 }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "certadillo.fullname" . }}
  labels: {{- include "certadillo.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tlsSecret }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ include "certadillo.fullname" . }}, port: {name: http}}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "certadillo.fullname" . }}
  labels: {{- include "certadillo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "certadillo.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{port: 8080, protocol: TCP}]
      {{- with .Values.networkPolicy.ingressFrom }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    {{- if .Values.networkPolicy.allowDns }}
    - ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    {{- end }}
    {{- with .Values.networkPolicy.egressTo }}
    - to: {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "certadillo.fullname" . }}
  labels: {{- include "certadillo.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "certadillo.selector" . | nindent 6 }}
  endpoints:
    - {port: http, path: /metrics, interval: {{ .Values.serviceMonitor.interval }}}
{{- end }}
