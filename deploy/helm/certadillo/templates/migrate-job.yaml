{{- if .Values.database.migrationJob.enabled }}
# Upgrades the schema before the new version's pods start (Helm hook), with
# the owner credential when one is given. Pods run with auto-migration off.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "certadillo.fullname" . }}-migrate
  labels: {{- include "certadillo.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.database.migrationJob.backoffLimit }}
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {{- include "certadillo.selector" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "certadillo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["db", "migrate"]
          env:
            {{- include "certadillo.env" . | nindent 12 }}
            {{- with .Values.database.migrationJob.ownerSecretKey }}
            - name: CERTADILLO_DB_URL
              valueFrom: {secretKeyRef: {name: {{ $.Values.existingSecret }}, key: {{ . }}}}
            {{- end }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 512Mi}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: data, mountPath: /var/lib/certadillo}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: data
          emptyDir: {}
{{- end }}
