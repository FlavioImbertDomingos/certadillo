[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certadillo"
version = "0.1.0"
description = "Open source, modular PKI and certificate lifecycle platform for regulated environments"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Flavio Domingos" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "cryptography>=43",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "click>=8.1",
  "asn1crypto>=1.5",
]

[project.optional-dependencies]
hsm = ["python-pkcs11>=0.7"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
certadillo = "certadillo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
certadillo = ["web/static/*", "default_policies.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-p no:logging --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
# S101 asserts in tests; S104 the server binds 0.0.0.0 inside containers;
# S303 SHA-1 is required for OCSP CertID hashes (RFC 6960) and is not used for signatures.
ignore = ["E501", "B008", "S101", "S104", "S303", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scripts/*" = ["S"]
