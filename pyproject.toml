[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certadillo"
version = "0.1.0"
description = "Open source, modular PKI and certificate lifecycle platform for regulated environments"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Flavio Domingos" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "cryptography>=43",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "click>=8.1",
  "asn1crypto>=1.5",
  "dnspython>=2.6",
  "pyasn1>=0.6",
  "pyasn1-modules>=0.4",
  "pyjwt[crypto]>=2.8",
  "alembic>=1.13",
]

[project.optional-dependencies]
hsm = ["python-pkcs11>=0.7"]
postgres = ["psycopg[binary]>=3.1"]
# python-oracledb thin mode: no Oracle Instant Client needed
oracle = ["oracledb>=2.0"]
# OpenTelemetry traces (CERTADILLO_TRACING=otlp)
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
adcs = ["ldap3>=2.9"]
provisioning = ["paramiko>=3.4", "boto3>=1.34"]
dev = ["pytest>=8", "opentelemetry-sdk>=1.25", "hypothesis>=6.100", "markdown>=3.5", "ldap3>=2.9", "paramiko>=3.4", "boto3>=1.34", "moto[acm]>=5.0"]

[project.scripts]
certadillo = "certadillo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
certadillo = ["web/static/*", "web/static/kb/*", "web/static/kb/img/*", "web/static/kb/vendor/*", "default_policies.yaml", "migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-p no:logging --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
# S101 asserts in tests; S104 the server binds 0.0.0.0 inside containers;
# S303 SHA-1 is required for OCSP CertID hashes (RFC 6960) and is not used for signatures.
ignore = ["E501", "B008", "S101", "S104", "S303", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scripts/*" = ["S"]
