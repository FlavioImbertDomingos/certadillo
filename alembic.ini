# For writing new migrations only; the server runs them itself.
#   alembic -x ... revision --autogenerate -m "add foo"   (against a database at head)
[alembic]
script_location = src/certadillo/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = postgresql+psycopg://cdl:pw@localhost:55432/cdl
